<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課堂投票｜老師管理</title>
<style>
  :root{ --bg:#0b1120; --card:#1b2437; --ink:#e8eefc; --muted:#93a4c0; --line:rgba(148,163,184,.2);
         --accent:#38bdf8; --ok:#34d399; --off:#f87171; --warn:#fbbf24; }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100dvh; background:var(--bg); color:var(--ink);
       font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif; padding:20px;}
  .wrap{max-width:980px; margin:0 auto; display:flex; flex-direction:column; gap:16px;}
  h1{margin:0; font-size:24px; letter-spacing:1px;}
  .muted{color:var(--muted); font-size:14px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:12px;}
  .grid{display:grid; grid-template-columns:1.35fr 1fr; gap:16px;}
  @media (max-width:860px){ .grid{grid-template-columns:1fr;} }
  label{font-size:14px; color:var(--muted);}
  input[type=text]{width:100%; padding:12px 14px; font-size:16px; border-radius:12px; border:1px solid var(--line);
                   background:#0c1424; color:var(--ink); outline:none;}
  input[type=text]:focus{border-color:var(--accent);}
  .optrow{display:flex; gap:8px; align-items:center;}
  .optrow .badge{flex:0 0 34px; height:34px; display:grid; place-items:center; border-radius:10px;
                 background:rgba(56,189,248,.16); color:var(--accent); font-weight:700;}
  button{border:0; border-radius:11px; padding:11px 16px; font-size:15px; font-weight:600; cursor:pointer;
         background:rgba(148,163,184,.16); color:var(--ink);}
  button:hover{background:rgba(148,163,184,.28);}
  button.primary{background:linear-gradient(180deg,#38bdf8,#0ea5e9); color:#04263a;}
  button.ok{background:linear-gradient(180deg,#4ade80,#22c55e); color:#052e16;}
  button.danger{background:rgba(248,113,113,.2); color:#fca5a5;}
  button.ghost{background:transparent; border:1px solid var(--line);}
  button:disabled{opacity:.5; cursor:not-allowed;}
  .row{display:flex; gap:10px; flex-wrap:wrap;}
  .status{display:flex; align-items:center; gap:10px; font-size:15px;}
  .tag{padding:5px 12px; border-radius:999px; font-size:14px; background:rgba(52,211,153,.16); color:var(--ok);}
  .tag.closed{background:rgba(248,113,113,.16); color:var(--off);}
  .counts{display:flex; flex-direction:column; gap:8px;}
  .c-row{display:flex; align-items:center; gap:10px; font-size:15px;}
  .c-row .name{flex:1;}
  .c-row .n{font-variant-numeric:tabular-nums; color:var(--accent); font-weight:700;}
  .qr{background:#fff; padding:10px; border-radius:12px; width:168px; height:168px; display:grid; place-items:center;}
  .copyrow{display:flex; gap:8px; align-items:center;}
  code{background:rgba(148,163,184,.14); padding:6px 10px; border-radius:8px; font-size:13px; word-break:break-all;}
  .warn{background:rgba(251,191,36,.12); border:1px solid rgba(251,191,36,.35); color:#fde68a; padding:12px 14px; border-radius:12px; font-size:13px; line-height:1.6;}
  /* 教師碼遮罩 */
  #gate{position:fixed; inset:0; background:#070d19; display:flex; flex-direction:column; align-items:center;
        justify-content:center; gap:14px; z-index:20; padding:20px; text-align:center;}
  #gate .box{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:26px; width:min(360px,92vw);}
  #gate input{text-align:center; font-size:24px; letter-spacing:8px;}
  .hidden{display:none !important;}
  a{color:var(--accent);}
</style>
</head>
<body>

<!-- 教師碼 -->
<div id="gate">
  <div class="box">
    <div style="font-size:34px">🔐</div>
    <h1 style="margin:10px 0 6px">老師管理頁</h1>
    <div class="muted" style="margin-bottom:14px">請輸入教師碼</div>
    <input id="code" type="text" inputmode="numeric" placeholder="----">
    <div class="row" style="margin-top:12px; justify-content:center">
      <button class="primary" id="enter">進入</button>
    </div>
    <div class="muted" id="gateMsg" style="margin-top:10px; min-height:18px"></div>
  </div>
</div>

<div class="wrap hidden" id="panel">
  <div>
    <h1>🗳️ 課堂投票｜老師管理</h1>
    <div class="muted">建立題目 → 開放投票 → 學生用手機選 → 展示頁即時更新</div>
  </div>

  <div class="card">
    <div class="status">
      <span>目前狀態：</span><span id="stateTag" class="tag">載入中…</span>
      <span class="muted" id="stateInfo"></span>
    </div>
    <div class="row">
      <button class="ok" id="btnOpen">▶ 開啟投票</button>
      <button class="ghost" id="btnClose">■ 結束投票</button>
      <button class="danger" id="btnReset">重設票數（保留題目）</button>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <label>題目</label>
      <input id="question" type="text" placeholder="例如：你覺得這一題的答案是？" maxlength="80">
      <label style="margin-top:6px">選項（2～6 個）</label>
      <div id="opts" style="display:flex; flex-direction:column; gap:8px"></div>
      <div class="row">
        <button class="ghost" id="btnAdd">＋ 新增選項</button>
        <button class="ghost" id="btnDel">－ 刪除最後一個</button>
      </div>
      <label style="display:flex; align-items:center; gap:8px; margin-top:4px">
        <input type="checkbox" id="showLive" checked> 學生投票後可看到即時票數
      </label>
      <div class="row" style="margin-top:6px">
        <button class="primary" id="btnSave">建立新投票（會清除票數）</button>
        <button class="ghost" id="btnLoad">重新載入目前設定</button>
      </div>
      <div class="warn">
        ⚠️ 本頁只用「教師碼」擋誤觸，<b>不是真正的安全機制</b>（前端檢查可被繞過）。<br>
        要真正的權限控管，需要加入 Firebase Authentication。課堂內部使用沒問題。
      </div>
    </div>

    <div class="card">
      <label>即時票數</label>
      <div class="counts" id="counts"><div class="muted">尚無資料</div></div>
      <div class="muted" id="totalVotes">總票數：0</div>
    </div>
  </div>

  <div class="card">
    <label>學生投票網址（給學生掃 QR 或點連結）</label>
    <div class="copyrow">
      <code id="studentURL">–</code>
      <button class="ghost" id="btnCopy">複製</button>
      <a id="openStudent" href="index.html" target="_blank"><button class="ghost">開啟學生頁</button></a>
      <a id="openDisplay" href="display.html" target="_blank"><button class="ghost">開啟展示頁</button></a>
    </div>
    <div id="qrBox" class="qr"><span class="muted" style="font-size:12px; color:#666">產生中…</span></div>
    <div class="muted" id="qrMsg"></div>
  </div>
</div>

<script type="module">
import { firebaseConfig, POLL_COLLECTION, POLL_DOC, TEACHER_CODE } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc, updateDoc, deleteField, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const db = getFirestore(initializeApp(firebaseConfig));
const ref = doc(db, POLL_COLLECTION, POLL_DOC);
const LETTERS = ["A","B","C","D","E","F"];

// ── 教師碼 ───────────────────────────────────────────
document.getElementById("enter").onclick = () => {
  const v = document.getElementById("code").value.trim();
  if (v === TEACHER_CODE){
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("panel").classList.remove("hidden");
    init();
  } else {
    document.getElementById("gateMsg").textContent = "教師碼錯誤";
  }
};
document.getElementById("code").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("enter").click(); });

// ── 編輯表單 ─────────────────────────────────────────
const els = {
  opts: document.getElementById("opts"),
  question: document.getElementById("question"),
  counts: document.getElementById("counts"),
  totalVotes: document.getElementById("totalVotes"),
  stateTag: document.getElementById("stateTag"),
  stateInfo: document.getElementById("stateInfo"),
  showLive: document.getElementById("showLive"),
  studentURL: document.getElementById("studentURL")
};
const studentURL = location.origin + location.pathname.replace(/admin\.html$/, "index.html");
els.studentURL.textContent = studentURL;
document.getElementById("openStudent").href = studentURL;

let draft = [ "選項 1", "選項 2" ];   // 編輯中的選項文字
let current = null;                    // Firestore 上的實際資料

function renderOptions(){
  els.opts.innerHTML = "";
  draft.forEach((t, i) => {
    const row = document.createElement("div");
    row.className = "optrow";
    row.innerHTML = `<span class="badge">${LETTERS[i]}</span>`;
    const inp = document.createElement("input");
    inp.type = "text";
    inp.value = t;
    inp.maxLength = 40;
    inp.oninput = () => { draft[i] = inp.value; };
    row.appendChild(inp);
    els.opts.appendChild(row);
  });
  document.getElementById("btnAdd").disabled = draft.length >= 6;
  document.getElementById("btnDel").disabled = draft.length <= 2;
}

document.getElementById("btnAdd").onclick = () => { if (draft.length < 6){ draft.push("選項 " + (draft.length+1)); renderOptions(); } };
document.getElementById("btnDel").onclick = () => { if (draft.length > 2){ draft.pop(); renderOptions(); } };

function optionsPayload(){
  return draft
    .map((t, i) => ({ id: LETTERS[i].toLowerCase(), text: (t || "").trim() || LETTERS[i] }))
    .filter(o => o.text);
}

// ── 寫入 Firestore ───────────────────────────────────
document.getElementById("btnSave").onclick = async () => {
  const q = els.question.value.trim();
  if (!q){ alert("請先輸入題目"); return; }
  const options = optionsPayload();
  if (options.length < 2){ alert("至少要兩個選項"); return; }
  const counts = {};
  options.forEach(o => counts[o.id] = 0);
  const round = Date.now();          // 新的一輪 → 學生端會忘記上一個選擇
  try{
    await setDoc(ref, {
      question: q,
      options,
      counts,
      open: true,
      showLive: els.showLive.checked,
      round,
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });
    alert("已建立新投票並開放！\n學生請開：" + studentURL);
  }catch(e){ console.error(e); alert("建立失敗：" + e.message); }
};

document.getElementById("btnOpen").onclick  = () => updateDoc(ref, { open: true,  updatedAt: serverTimestamp() }).catch(e => alert("失敗：" + e.message));
document.getElementById("btnClose").onclick = () => updateDoc(ref, { open: false, updatedAt: serverTimestamp() }).catch(e => alert("失敗：" + e.message));

document.getElementById("btnReset").onclick = async () => {
  if (!current) return alert("目前沒有投票");
  if (!confirm("確定要把所有票數歸零嗎？（題目和選項會保留）")) return;
  const counts = {};
  (current.options || []).forEach(o => counts[o.id] = 0);
  const round = Date.now();          // 重設也算新的一輪
  await updateDoc(ref, { counts, round, updatedAt: serverTimestamp() });
};

document.getElementById("btnLoad").onclick = () => {
  if (!current) return;
  els.question.value = current.question || "";
  draft = (current.options || []).map(o => o.text);
  if (draft.length < 2) draft = ["選項 1", "選項 2"];
  document.getElementById("showLive").checked = current.showLive !== false;
  renderOptions();
};

els.showLive.addEventListener("change", () => {
  if (current) updateDoc(ref, { showLive: els.showLive.checked, updatedAt: serverTimestamp() }).catch(()=>{});
});

// ── 即時監聽 ─────────────────────────────────────────
function init(){
  renderOptions();
  onSnapshot(ref, snap => {
    if (!snap.exists()){
      current = null;
      els.stateTag.textContent = "尚未建立";
      els.stateTag.className = "tag closed";
      els.stateInfo.textContent = "請先建立題目";
      els.counts.innerHTML = '<div class="muted">尚無資料</div>';
      els.totalVotes.textContent = "總票數：0";
      return;
    }
    current = snap.data();
    const open = current.open !== false;
    els.stateTag.textContent = open ? "投票進行中" : "已結束";
    els.stateTag.className = "tag" + (open ? "" : " closed");
    els.stateInfo.textContent = current.question ? "｜" + current.question : "";

    const counts = current.counts || {};
    const sum = Object.values(counts).reduce((a,b) => a + (b||0), 0);
    els.totalVotes.textContent = "總票數：" + sum;
    els.counts.innerHTML = "";
    (current.options || []).forEach((o, i) => {
      const c = counts[o.id] || 0;
      const pct = sum ? Math.round(c/sum*100) : 0;
      const row = document.createElement("div");
      row.className = "c-row";
      row.innerHTML = `<span class="name">${LETTERS[i] || "?"}. ${escapeHtml(o.text)}</span><span class="n">${c} 票 · ${pct}%</span>`;
      els.counts.appendChild(row);
    });

    if (!els.question.value && current.question) els.question.value = current.question;
    if (!draft.length) draft = (current.options || []).map(o => o.text);
  });

  // QR code（載入失敗就只顯示網址）
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js";
  s.onload = () => drawQR();
  s.onerror = () => { document.getElementById("qrMsg").textContent = "QR 產生器載入失敗，請直接複製上方網址給學生。"; };
  document.head.appendChild(s);
}

function drawQR(){
  const box = document.getElementById("qrBox");
  if (!window.QRCode){ document.getElementById("qrMsg").textContent = "QR 產生器未載入。"; return; }
  box.innerHTML = "";
  new window.QRCode(box, { text: studentURL, width: 148, height: 148, correctLevel: window.QRCode.CorrectLevel.M });
  document.getElementById("qrMsg").textContent = "學生掃這個 QR 就可以投票（同一台裝置只能投一次）";
}

document.getElementById("btnCopy").onclick = async () => {
  try { await navigator.clipboard.writeText(studentURL); alert("已複製網址：" + studentURL); }
  catch(e){ alert("複製失敗，請手動複製：" + studentURL); }
};

function escapeHtml(s){ return String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
</script>
</body>
</html>
